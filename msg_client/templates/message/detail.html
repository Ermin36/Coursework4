{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-3 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10 col-12">
            <div class="card bg-dark border-secondary text-white">
                <div class="card-header bg-transparent border-0 py-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h3 class="mb-0 fw-bold text-info">{{ message.topic }}</h3>
                        <span class="badge bg-secondary text-uppercase small px-3 py-1">
                            Сообщение
                        </span>
                    </div>
                </div>

                <div class="card-body p-4">
                    <!-- Тема -->
                    <div class="mb-4">
                        <label class="text-secondary small text-uppercase fw-bold d-block">Тема письма</label>
                        <span class="h4 fw-normal text-white">{{ message.topic }}</span>
                    </div>

                    <!-- Текст сообщения -->
                    <div class="mb-5">
                        <label class="text-secondary small text-uppercase fw-bold d-block mb-2">Текст сообщения</label>
                        {% if message.description %}
                            <p class="text-white mb-0" style="white-space: pre-line;">
                                {{ message.description }}
                            </p>
                        {% else %}
                            <p class="text-muted mb-0">Текст не указан.</p>
                        {% endif %}
                    </div>

                    <!-- Действия -->
                    <div class="pt-4 border-top border-secondary">
                        <div class="d-flex gap-2 flex-wrap">
                            <a href="{% url 'msg_client:message_update' message.pk %}" class="btn btn-outline-warning">
                                Изменить
                            </a>
                            <form action="{% url 'msg_client:message_delete' message.pk %}" method="post" class="d-inline">
                                {% csrf_token %}
                                <button type="submit"
                                        class="btn btn-outline-danger"
                                        onclick="return confirm('Вы уверены, что хотите удалить сообщение «{{ message.topic }}»?');">
                                    Удалить
                                </button>
                            </form>
                            <a href="{% url 'msg_client:message_list' %}" class="btn btn-outline-secondary">Назад к списку</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
